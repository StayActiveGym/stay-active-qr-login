<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Stay Active QR Login</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 30px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: white;
      color: black;
    }

    #scanAgain {
      background: #333;
      color: white;
      display: none;
    }

    .status {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #222;
    }

    .error {
      background: #8b1111;
    }

    .member {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      background: #075c31;
    }

    .member-name {
      font-size: 25px;
      font-weight: bold;
      margin: 10px 0;
    }

    .member-id {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .info-box {
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      padding: 15px;
      text-align: left;
    }

    .info-row {
      padding: 14px 5px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-size: 13px;
      color: #ccc;
      text-transform: uppercase;
    }

    .info-value {
      font-size: 20px;
      font-weight: bold;
      margin-top: 5px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>STAY ACTIVE</h1>

  <div class="subtitle">
    Lifestyle Fitness Gym
  </div>

  <h2>MEMBER LOGIN</h2>


  <!-- QR SCANNER -->

  <div id="reader"></div>


  <!-- START -->

  <button id="startButton"
          onclick="startScanner()">

    📷 START SCANNER

  </button>


  <!-- STATUS -->

  <div id="status"
       class="status">

    Press START SCANNER

  </div>


  <!-- MEMBER INFORMATION -->

  <div id="member"
       class="member">

    <h2>✅ LOGIN SUCCESSFUL</h2>


    <div class="member-name"
         id="memberName">
    </div>


    <div class="member-id"
         id="memberId">
    </div>


    <div class="info-box">


      <!-- ANNUAL MEMBERSHIP -->

      <div class="info-row">

        <div class="info-label">
          Annual Membership Credit
        </div>

        <div class="info-value"
             id="annualCredit">
          -
        </div>

      </div>


      <!-- WORKOUT PLAN CREDIT -->

      <div class="info-row">

        <div class="info-label">
          Gym Workout Plan Credit
        </div>

        <div class="info-value"
             id="workoutCredit">
          -
        </div>

      </div>


      <!-- LOCKER -->

      <div class="info-row">

        <div class="info-label">
          Locker Rental Credit
        </div>

        <div class="info-value"
             id="lockerCredit">
          -
        </div>

      </div>


      <!-- LOGIN TIME -->

      <div class="info-row">

        <div class="info-label">
          Login Time
        </div>

        <div class="info-value"
             id="loginTime">
          -
        </div>

      </div>


    </div>

  </div>


  <!-- SCAN AGAIN -->

  <button id="scanAgain"
          onclick="resetScanner()">

    📷 SCAN NEXT MEMBER

  </button>

</div>


<script>


/*
=================================================
YOUR NEW WORKING APPS SCRIPT URL
=================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbxdsCpfbiwcsWbhHN0mM7O5CkAjBNSzo4lapNmrywVTcPmEuCCQ4EfrXGhlQy8Oy_HL/exec";


let scanner = null;

let processing = false;


/*
=================================================
START SCANNER
=================================================
*/

function startScanner() {

  if (processing) {
    return;
  }

  processing = false;


  document.getElementById(
    "startButton"
  ).style.display = "none";


  document.getElementById(
    "scanAgain"
  ).style.display = "none";


  document.getElementById(
    "member"
  ).style.display = "none";


  showStatus(
    "Requesting camera..."
  );


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    onScanSuccess,

    onScanError

  )

  .then(function() {

    showStatus(
      "📷 Scan Member QR Code"
    );

  })

  .catch(function(error) {

    showError(
      "CAMERA ERROR: " + error
    );


    document.getElementById(
      "startButton"
    ).style.display = "block";

  });

}


/*
=================================================
QR CODE SUCCESS
=================================================
*/

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;


  const memberId =
    decodedText.trim();


  showStatus(
    "Checking Member ID..."
  );


  if (scanner) {

    scanner.stop()

      .then(function() {

        loginMember(memberId);

      })

      .catch(function() {

        loginMember(memberId);

      });

  }

  else {

    loginMember(memberId);

  }

}


/*
=================================================
LOGIN MEMBER
=================================================
*/

function loginMember(memberId) {

  const callbackName =
    "loginCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      handleLogin(result);


      delete window[callbackName];


      const oldScript =
        document.getElementById(
          callbackName
        );


      if (oldScript) {
        oldScript.remove();
      }

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  /*
  IMPORTANT:
  JSONP CALLBACK
  */

  script.src =
    API_URL +
    "?action=login" +
    "&memberId=" +
    encodeURIComponent(memberId) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      showError(
        "Unable to connect to the server."
      );


      delete window[callbackName];


      script.remove();


      processing = false;


      document.getElementById(
        "scanAgain"
      ).style.display =
        "block";

    };


  document.body.appendChild(script);

}


/*
=================================================
DISPLAY RESULT
=================================================
*/

function handleLogin(result) {

  console.log(
    "LOGIN RESULT:",
    result
  );


  if (!result ||
      !result.success) {

    showError(
      result && result.message
        ? result.message
        : "Login failed."
    );


    processing = false;


    document.getElementById(
      "scanAgain"
    ).style.display =
      "block";


    return;

  }


  /*
  HIDE STATUS
  */

  document.getElementById(
    "status"
  ).style.display =
    "none";


  /*
  SHOW MEMBER
  */

  document.getElementById(
    "member"
  ).style.display =
    "block";


  /*
  ==========================================
  NAME
  ==========================================
  */

  document.getElementById(
    "memberName"
  ).innerText =
    result.name || "-";


  /*
  ==========================================
  MEMBER ID
  ==========================================
  */

  document.getElementById(
    "memberId"
  ).innerText =
    result.memberId || "-";


  /*
  ==========================================
  ANNUAL MEMBERSHIP CREDIT
  ==========================================
  */

  document.getElementById(
    "annualCredit"
  ).innerText =
    result.annualCredit !== undefined &&
    result.annualCredit !== ""
      ? result.annualCredit + " Days"
      : "N/A";


  /*
  ==========================================
  WORKOUT PLAN CREDIT
  ==========================================
  */

  if (
    result.workoutCredit !== undefined &&
    result.workoutCredit !== ""
  ) {

    if (
      String(result.workoutCredit)
        .toLowerCase()
        .includes("credit")
    ) {

      document.getElementById(
        "workoutCredit"
      ).innerText =
        result.workoutCredit;

    }

    else {

      document.getElementById(
        "workoutCredit"
      ).innerText =
        result.workoutCredit + " Credit";

    }

  }

  else {

    document.getElementById(
      "workoutCredit"
    ).innerText =
      "N/A";

  }


  /*
  ==========================================
  LOCKER RENTAL CREDIT
  ==========================================
  */

  if (
    result.lockerCredit !== undefined &&
    result.lockerCredit !== ""
  ) {

    document.getElementById(
      "lockerCredit"
    ).innerText =
      result.lockerCredit;

  }

  else {

    document.getElementById(
      "lockerCredit"
    ).innerText =
      "N/A";

  }


  /*
  ==========================================
  LOGIN TIME
  ==========================================
  */

  document.getElementById(
    "loginTime"
  ).innerText =
    result.timestamp || "-";


  /*
  ==========================================
  SCAN AGAIN
  ==========================================
  */

  document.getElementById(
    "scanAgain"
  ).style.display =
    "block";

}


/*
=================================================
RESET SCANNER
=================================================
*/

function resetScanner() {

  processing = false;


  document.getElementById(
    "member"
  ).style.display =
    "none";


  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";


  document.getElementById(
    "startButton"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).style.display =
    "block";


  showStatus(
    "Press START SCANNER"
  );

}


/*
=================================================
STATUS
=================================================
*/

function showStatus(message) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "status";


  status.innerText =
    message;


  status.style.display =
    "block";

}


/*
=================================================
ERROR
=================================================
*/

function showError(message) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "status error";


  status.innerText =
    message;


  status.style.display =
    "block";

}


/*
=================================================
IGNORE NORMAL QR ERRORS
=================================================
*/

function onScanError(errorMessage) {

  // Normal QR scanning errors are ignored.

}

</script>

</body>

</html>
