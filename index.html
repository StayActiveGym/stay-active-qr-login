<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stay Active QR Login</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

/* ==================================================
   STAY ACTIVE COLOR THEME
================================================== */

:root {

  --yellow: #FFD400;
  --yellow-dark: #E6BD00;

  --black: #000000;
  --dark: #111111;
  --dark2: #1A1A1A;
  --dark3: #222222;

  --white: #FFFFFF;
  --gray: #AAAAAA;

  --red: #FF1E1E;

}


/* ==================================================
   GENERAL
================================================== */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background:
    radial-gradient(
      circle at top,
      #222 0%,
      #111 45%,
      #000 100%
    );

  color: var(--white);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  text-align: center;

  min-height: 100vh;

}


/* ==================================================
   CONTAINER
================================================== */

.container {

  width: 100%;

  max-width: 500px;

  margin: auto;

  padding: 20px;

}


/* ==================================================
   HEADER
================================================== */

h1 {

  margin: 5px 0 0;

  font-size: 34px;

  font-weight: 900;

  letter-spacing: 2px;

  color: var(--yellow);

  text-shadow:
    0 0 10px rgba(255,212,0,0.25);

}


.subtitle {

  color: #BBBBBB;

  margin-top: 3px;

  margin-bottom: 22px;

  font-size: 14px;

  letter-spacing: 1px;

}


h2 {

  margin: 0 0 18px;

  font-size: 23px;

  color: var(--white);

  font-weight: 800;

  letter-spacing: 1px;

}


/* ==================================================
   QR SCANNER
================================================== */

#reader {

  width: 100%;

  background: #000;

  border: 3px solid var(--yellow);

  border-radius: 15px;

  overflow: hidden;

  box-shadow:
    0 0 15px rgba(255,212,0,0.15);

}


#reader * {

  font-family:
    Arial,
    Helvetica,
    sans-serif !important;

}


/* ==================================================
   BUTTONS
================================================== */

button {

  width: 100%;

  padding: 17px;

  margin-top: 15px;

  border: 0;

  border-radius: 10px;

  font-size: 17px;

  font-weight: 900;

  cursor: pointer;

  transition: 0.2s;

}


button:active {

  transform: scale(0.98);

}


/* ==================================================
   START BUTTON
================================================== */

#startButton {

  background: var(--yellow);

  color: #000;

  box-shadow:
    0 4px 0 var(--yellow-dark);

}


#startButton:hover {

  background: #FFE13B;

}


/* ==================================================
   SCAN AGAIN BUTTON
================================================== */

#scanAgain {

  display: none;

  background: var(--yellow);

  color: #000;

  box-shadow:
    0 4px 0 var(--yellow-dark);

}


/* ==================================================
   STATUS
================================================== */

#status {

  margin-top: 15px;

  padding: 15px;

  border-radius: 10px;

  background: var(--dark3);

  border: 1px solid #444;

  color: var(--yellow);

  font-weight: bold;

  min-height: 50px;

  display: flex;

  align-items: center;

  justify-content: center;

}


/* ==================================================
   ERROR
================================================== */

.error {

  background: #4D0000 !important;

  border: 2px solid var(--red) !important;

  color: #FFFFFF !important;

}


/* ==================================================
   MEMBER INFORMATION
================================================== */

#member {

  display: none;

  margin-top: 20px;

  padding: 20px;

  border-radius: 15px;

  background: #111111;

  border: 2px solid var(--yellow);

  box-shadow:
    0 0 18px rgba(255,212,0,0.12);

}


/* ==================================================
   SUCCESS MESSAGE
================================================== */

.success {

  font-size: 22px;

  font-weight: 900;

  margin-bottom: 15px;

  color: var(--yellow);

}


/* ==================================================
   MEMBER NAME
================================================== */

.member-name {

  font-size: 28px;

  font-weight: 900;

  margin: 10px 0 5px;

  color: #FFFFFF;

}


/* ==================================================
   MEMBER ID
================================================== */

.member-id {

  font-size: 20px;

  font-weight: 800;

  margin-bottom: 20px;

  color: var(--yellow);

}


/* ==================================================
   INFO BOX
================================================== */

.info-box {

  background:
    #1A1A1A;

  border: 1px solid #333;

  border-radius: 12px;

  padding: 10px 15px;

  text-align: left;

}


/* ==================================================
   INFO ROW
================================================== */

.info-row {

  padding: 15px 5px;

  border-bottom:
    1px solid
    rgba(255,255,255,0.15);

}


.info-row:last-child {

  border-bottom: none;

}


/* ==================================================
   LABEL
================================================== */

.label {

  font-size: 13px;

  color: #BBBBBB;

  text-transform: uppercase;

  letter-spacing: 0.5px;

}


/* ==================================================
   VALUE
================================================== */

.value {

  font-size: 22px;

  font-weight: 900;

  margin-top: 5px;

  color: #FFFFFF;

}


/* ==================================================
   ZERO VALUE
   RED + CONTINUOUS BLINK
================================================== */

.zero-value {

  color: #FF1E1E !important;

  font-weight: 900;

  animation:
    zeroBlink 0.8s infinite;

}


/* ==================================================
   BLINK ANIMATION
================================================== */

@keyframes zeroBlink {

  0%,
  45% {

    opacity: 1;

    text-shadow:
      0 0 8px rgba(255,0,0,0.9);

  }

  50%,
  100% {

    opacity: 0.25;

    text-shadow: none;

  }

}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 400px) {

  .container {

    padding: 15px;

  }


  h1 {

    font-size: 30px;

  }


  h2 {

    font-size: 21px;

  }


  .member-name {

    font-size: 25px;

  }


  .value {

    font-size: 20px;

  }

}


/* ==================================================
   HTML5 QR CODE BUTTONS
================================================== */

#reader__dashboard_section_csr button {

  background: var(--yellow) !important;

  color: #000 !important;

  border: none !important;

  border-radius: 8px !important;

  font-weight: bold !important;

}


#reader__dashboard_section_swaplink {

  color: var(--yellow) !important;

}

</style>

</head>


<body>


<div class="container">


<!-- ==================================================
     HEADER
================================================== -->

<h1>
  STAY ACTIVE
</h1>


<div class="subtitle">
  Lifestyle Fitness Gym
</div>


<h2>
  MEMBER LOGIN
</h2>


<!-- ==================================================
     QR SCANNER
================================================== -->

<div id="reader"></div>


<!-- ==================================================
     START SCANNER
================================================== -->

<button
  id="startButton"
  onclick="startScanner()">

  📷 START SCANNER

</button>


<!-- ==================================================
     STATUS
================================================== -->

<div id="status">

  Press START SCANNER

</div>


<!-- ==================================================
     MEMBER INFORMATION
================================================== -->

<div id="member">


  <div class="success">

    ✅ LOGIN SUCCESSFUL

  </div>


  <div
    class="member-name"
    id="memberName">

  </div>


  <div
    class="member-id"
    id="memberId">

  </div>


  <div class="info-box">


    <!-- ==========================================
         ANNUAL MEMBERSHIP
    =========================================== -->

    <div class="info-row">

      <div class="label">

        Annual Membership Credit

      </div>


      <div
        class="value"
        id="annualCredit">

        N/A

      </div>

    </div>


    <!-- ==========================================
         WORKOUT PLAN
    =========================================== -->

    <div class="info-row">

      <div class="label">

        Gym Workout Plan Credit

      </div>


      <div
        class="value"
        id="workoutCredit">

        N/A

      </div>

    </div>


    <!-- ==========================================
         LOCKER
    =========================================== -->

    <div class="info-row">

      <div class="label">

        Locker Rental Credit

      </div>


      <div
        class="value"
        id="lockerCredit">

        N/A

      </div>

    </div>


    <!-- ==========================================
         PROFESSIONAL TRAINING
    =========================================== -->

    <div class="info-row">

      <div class="label">

        Professional Training Credit

      </div>


      <div
        class="value"
        id="professionalTrainingCredit">

        N/A

      </div>

    </div>


    <!-- ==========================================
         LOGIN TIME
    =========================================== -->

    <div class="info-row">

      <div class="label">

        Login Time

      </div>


      <div
        class="value"
        id="loginTime">

        N/A

      </div>

    </div>


  </div>


</div>


<!-- ==================================================
     SCAN NEXT MEMBER
================================================== -->

<button
  id="scanAgain"
  onclick="resetScanner()">

  📷 SCAN NEXT MEMBER

</button>


</div>


<script>


/*
==================================================
GOOGLE APPS SCRIPT
==================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbxam82_ho5kvQZZGE7oWT5duGCnK5XXQAmJzWL7mZIp1OSX6Sk5yd63bmm7m0FZWd5m/exec";


let scanner = null;

let processing = false;


/*
==================================================
START CAMERA
==================================================
*/

function startScanner() {

  processing = false;


  document.getElementById(
    "startButton"
  ).style.display = "none";


  document.getElementById(
    "scanAgain"
  ).style.display = "none";


  document.getElementById(
    "member"
  ).style.display = "none";


  showStatus(
    "Opening camera..."
  );


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      }

    },


    function(decodedText) {


      if (processing) {

        return;

      }


      processing = true;


      processMember(
        decodedText.trim()
      );


    },


    function(errorMessage) {

      // Ignore normal QR errors

    }


  )


  .then(function() {

    showStatus(
      "📷 Scan Member QR Code"
    );

  })


  .catch(function(error) {

    showError(
      "CAMERA ERROR: " + error
    );


    document.getElementById(
      "startButton"
    ).style.display = "block";

  });

}


/*
==================================================
PROCESS QR
==================================================
*/

function processMember(memberId) {

  showStatus(
    "Checking Member ID: " +
    memberId
  );


  stopScanner(function() {

    getMemberData(memberId);

  });

}


/*
==================================================
STOP CAMERA
==================================================
*/

function stopScanner(callback) {

  if (!scanner) {

    callback();

    return;

  }


  scanner.stop()

  .then(function() {

    callback();

  })

  .catch(function() {

    callback();

  });

}


/*
==================================================
GET DATA FROM APPS SCRIPT
==================================================
*/

function getMemberData(memberId) {


  const callbackName =
    "stayActive_" +
    Date.now();


  /*
  JSONP CALLBACK
  */

  window[callbackName] =
    function(result) {


      console.log(
        "APPS SCRIPT RESULT:",
        result
      );


      displayMember(
        result
      );


      delete window[callbackName];

    };


  /*
  CREATE SCRIPT
  */

  const script =
    document.createElement(
      "script"
    );


  /*
  JSONP REQUEST
  */

  script.src =
    API_URL +
    "?action=login" +
    "&memberId=" +
    encodeURIComponent(
      memberId
    ) +
    "&callback=" +
    callbackName;


  /*
  CONNECTION ERROR
  */

  script.onerror =
    function() {


      showError(
        "Unable to connect to Apps Script."
      );


      processing = false;


      document.getElementById(
        "scanAgain"
      ).style.display =
        "block";


      delete window[callbackName];


      script.remove();

    };


  /*
  ADD REQUEST
  */

  document.body.appendChild(
    script
  );

}


/*
==================================================
SET CREDIT VALUE
==================================================

ZERO VALUE:

RED + CONTINUOUS BLINK

==================================================
*/

function setCreditValue(
  elementId,
  value,
  suffix
) {


  const element =
    document.getElementById(
      elementId
    );


  /*
  Remove previous zero styling
  */

  element.classList.remove(
    "zero-value"
  );


  /*
  EMPTY VALUE
  */

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    element.innerText = "N/A";

    return;

  }


  /*
  Convert to text
  */

  const text =
    String(value).trim();


  /*
  Detect numeric zero
  */

  const numericValue =
    Number(text);


  const isZero =
    !isNaN(numericValue) &&
    numericValue === 0;


  /*
  DISPLAY VALUE
  */

  element.innerText =
    text +
    suffix;


  /*
  RED + BLINK
  */

  if (isZero) {

    element.classList.add(
      "zero-value"
    );

  }

}


/*
==================================================
DISPLAY MEMBER
==================================================
*/

function displayMember(result) {


  console.log(
    "DISPLAY RESULT:",
    result
  );


  /*
  NO RESPONSE
  */

  if (!result) {

    showError(
      "No response received."
    );


    processing = false;

    return;

  }


  /*
  MEMBER NOT FOUND
  */

  if (!result.success) {

    showError(
      result.message ||
      "Member not found."
    );


    processing = false;


    document.getElementById(
      "scanAgain"
    ).style.display =
      "block";


    return;

  }


  /*
  NAME
  */

  document.getElementById(
    "memberName"
  ).innerText =
    result.name || "N/A";


  /*
  MEMBER ID
  */

  document.getElementById(
    "memberId"
  ).innerText =
    result.memberId || "N/A";


  /*
  ANNUAL MEMBERSHIP CREDIT
  */

  setCreditValue(

    "annualCredit",

    result.annualCredit,

    " Days"

  );


  /*
  WORKOUT PLAN CREDIT
  */

  setCreditValue(

    "workoutCredit",

    result.workoutCredit,

    " Credit"

  );


  /*
  LOCKER CREDIT

  "No Locker" remains normal.

  Only numeric zero blinks.

  */

  setCreditValue(

    "lockerCredit",

    result.lockerCredit,

    ""

  );


  /*
  PROFESSIONAL TRAINING CREDIT
  */

  setCreditValue(

    "professionalTrainingCredit",

    result.professionalTrainingCredit,

    " Credit"

  );


  /*
  LOGIN TIME
  */

  document.getElementById(
    "loginTime"
  ).innerText =
    result.timestamp || "N/A";


  /*
  SHOW MEMBER
  */

  document.getElementById(
    "member"
  ).style.display =
    "block";


  /*
  HIDE STATUS
  */

  document.getElementById(
    "status"
  ).style.display =
    "none";


  /*
  SHOW SCAN AGAIN
  */

  document.getElementById(
    "scanAgain"
  ).style.display =
    "block";

}


/*
==================================================
RESET
==================================================
*/

function resetScanner() {


  processing = false;


  /*
  HIDE MEMBER
  */

  document.getElementById(
    "member"
  ).style.display =
    "none";


  /*
  HIDE SCAN AGAIN
  */

  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";


  /*
  SHOW START BUTTON
  */

  document.getElementById(
    "startButton"
  ).style.display =
    "block";


  /*
  RESET STATUS
  */

  showStatus(
    "Press START SCANNER"
  );


  /*
  REMOVE ZERO BLINKING
  */

  document.getElementById(
    "annualCredit"
  ).classList.remove(
    "zero-value"
  );


  document.getElementById(
    "workoutCredit"
  ).classList.remove(
    "zero-value"
  );


  document.getElementById(
    "lockerCredit"
  ).classList.remove(
    "zero-value"
  );


  document.getElementById(
    "professionalTrainingCredit"
  ).classList.remove(
    "zero-value"
  );

}


/*
==================================================
STATUS
==================================================
*/

function showStatus(message) {


  const status =
    document.getElementById(
      "status"
    );


  status.className = "";


  status.innerText =
    message;


  status.style.display =
    "flex";

}


/*
==================================================
ERROR
==================================================
*/

function showError(message) {


  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "error";


  status.innerText =
    message;


  status.style.display =
    "flex";

}


</script>

</body>

</html>
