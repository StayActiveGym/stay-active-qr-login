<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stay Active QR Login</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

/* ==================================================
   GENERAL
================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}


/* ==================================================
   MAIN CONTAINER
================================================== */

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 20px;
}


/* ==================================================
   HEADER
================================================== */

.header {
  text-align: center;
  margin-bottom: 20px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 1px;
}

.header span {
  color: #ffd400;
}


/* ==================================================
   SCANNER
================================================== */

#reader {
  width: 100%;
  max-width: 500px;
  margin: 0 auto 20px auto;
  border: 3px solid #ffd400 !important;
  border-radius: 15px;
  overflow: hidden;
  background: #111;
}


/* ==================================================
   STATUS
================================================== */

.status {
  text-align: center;
  font-size: 16px;
  color: #aaa;
  margin: 15px 0;
}

.status.active {
  color: #ffd400;
}


/* ==================================================
   MEMBER CARD
================================================== */

.member-card {
  display: none;
  background: #111;
  border: 1px solid #333;
  border-radius: 15px;
  padding: 20px;
  margin-top: 20px;
}

.member-card.show {
  display: block;
}


/* ==================================================
   MEMBER NAME
================================================== */

.member-name {
  text-align: center;
  font-size: 28px;
  font-weight: 900;
  color: #ffd400;
  margin-bottom: 20px;
  word-break: break-word;
}


/* ==================================================
   INFORMATION ROW
================================================== */

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;

  padding: 13px 0;

  border-bottom: 1px solid #292929;
}

.info-row:last-child {
  border-bottom: none;
}

.label {
  color: #999;
  font-size: 15px;
}

.value {
  color: #fff;
  font-size: 17px;
  font-weight: 800;
  text-align: right;
  word-break: break-word;
}


/* ==================================================
   ZERO CREDIT WARNING
================================================== */

.zero-value {
  color: #ff2222 !important;
  animation: blinkZero 0.8s infinite;
}

@keyframes blinkZero {

  0% {
    opacity: 1;
  }

  50% {
    opacity: 0.15;
  }

  100% {
    opacity: 1;
  }

}


/* ==================================================
   BUTTON
================================================== */

.scan-again {
  width: 100%;
  margin-top: 20px;

  padding: 15px;

  border: none;
  border-radius: 10px;

  background: #ffd400;
  color: #000;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}

.scan-again:hover {
  background: #fff;
}


/* ==================================================
   ERROR
================================================== */

.error {
  color: #ff3333;
  text-align: center;
  font-weight: 700;
  margin-top: 15px;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 500px) {

  .container {
    padding: 12px;
  }

  .header h1 {
    font-size: 26px;
  }

  .member-name {
    font-size: 23px;
  }

  .label {
    font-size: 13px;
  }

  .value {
    font-size: 15px;
  }

}

</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>
      STAY <span>ACTIVE</span>
    </h1>

  </div>


  <!-- SCANNER -->

  <div id="reader"></div>


  <!-- STATUS -->

  <div id="status"
       class="status active">

    Scan your Member QR Code

  </div>


  <!-- ERROR -->

  <div id="error"
       class="error">
  </div>


  <!-- MEMBER INFORMATION -->

  <div id="memberCard"
       class="member-card">


    <div id="memberName"
         class="member-name">

    </div>


    <div class="info-row">

      <div class="label">
        Member ID
      </div>

      <div id="memberId"
           class="value">
      </div>

    </div>


    <div class="info-row">

      <div class="label">
        Contact
      </div>

      <div id="contact"
           class="value">
      </div>

    </div>


    <div class="info-row">

      <div class="label">
        Annual Membership Credit
      </div>

      <div id="annualCredit"
           class="value">
      </div>

    </div>


    <div class="info-row">

      <div class="label">
        Gym Workout Plan Credit
      </div>

      <div id="workoutCredit"
           class="value">
      </div>

    </div>


    <div class="info-row">

      <div class="label">
        Locker Rental Credit
      </div>

      <div id="lockerCredit"
           class="value">
      </div>

    </div>


    <div class="info-row">

      <div class="label">
        Professional Training Credit
      </div>

      <div id="professionalTrainingCredit"
           class="value">
      </div>

    </div>


    <div class="info-row">

      <div class="label">
        Login Time
      </div>

      <div id="loginTime"
           class="value">
      </div>

    </div>


    <button class="scan-again"
            onclick="resetScanner()">

      SCAN AGAIN

    </button>


  </div>

</div>



<script>

/* ==================================================
   APPS SCRIPT WEB APP URL
================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyXNaie8FuJlwr1fWbACn-70mxSqGAJBrpE2DN82yuaAp4YbHEaBcgRLT0gsqBMmQAA/exec";


/* ==================================================
   SCANNER VARIABLES
================================================== */

let html5QrCode = null;

let scannerRunning = false;

let processingScan = false;


/* ==================================================
   START SCANNER
================================================== */

function startScanner() {

  document.getElementById("memberCard")
    .classList.remove("show");

  document.getElementById("error")
    .textContent = "";

  document.getElementById("status")
    .textContent = "Scan your Member QR Code";

  document.getElementById("status")
    .classList.add("active");


  html5QrCode = new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: function(viewfinderWidth, viewfinderHeight) {

      const size =
        Math.min(viewfinderWidth, viewfinderHeight) * 0.70;

      return {
        width: size,
        height: size
      };

    },

    aspectRatio: 1.0

  };


  html5QrCode
    .start(
      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )
    .then(function() {

      scannerRunning = true;

    })
    .catch(function(error) {

      scannerRunning = false;

      document.getElementById("error")
        .textContent =
        "Unable to start camera. Please allow camera access.";

      console.error(error);

    });

}


/* ==================================================
   SCAN SUCCESS
================================================== */

function onScanSuccess(decodedText) {

  if (processingScan) {
    return;
  }

  processingScan = true;


  const memberId =
    String(decodedText).trim();


  document.getElementById("status")
    .textContent = "Checking member...";


  document.getElementById("error")
    .textContent = "";


  /* Stop scanner */

  if (html5QrCode && scannerRunning) {

    html5QrCode
      .stop()
      .then(function() {

        scannerRunning = false;

        lookupMember(memberId);

      })
      .catch(function() {

        scannerRunning = false;

        lookupMember(memberId);

      });

  }

  else {

    lookupMember(memberId);

  }

}


/* ==================================================
   SCAN FAILURE
================================================== */

function onScanFailure(error) {

  // Ignore normal scan failures.
  // QR scanner continuously checks the camera.

}


/* ==================================================
   LOOKUP MEMBER
================================================== */

function lookupMember(memberId) {


  /*
    JSONP is used because the GitHub
    frontend and Apps Script are
    different domains.
  */

  const callbackName =
    "stayActiveCallback_" +
    Date.now();


  window[callbackName] = function(result) {


    /* Remove script */

    const script =
      document.getElementById(callbackName);


    if (script) {
      script.remove();
    }


    /* Remove callback */

    try {
      delete window[callbackName];
    }

    catch (e) {
      window[callbackName] = undefined;
    }


    /* Process result */

    if (result && result.success) {

      displayMember(result);

    }

    else {

      document.getElementById("status")
        .textContent =
        "Member not found.";

      document.getElementById("status")
        .classList.remove("active");


      document.getElementById("error")
        .textContent =
        result && result.message
          ? result.message
          : "Unable to find member.";


      processingScan = false;

      setTimeout(function() {

        resetScanner();

      }, 2500);

    }

  };


  const script =
    document.createElement("script");


  script.id = callbackName;


  script.src =
    API_URL +
    "?action=login" +
    "&memberId=" +
    encodeURIComponent(memberId) +
    "&callback=" +
    callbackName;


  script.onerror = function() {

    document.getElementById("status")
      .textContent =
      "Connection error.";

    document.getElementById("status")
      .classList.remove("active");


    document.getElementById("error")
      .textContent =
      "Unable to connect to the member database.";


    processingScan = false;


    script.remove();

    try {
      delete window[callbackName];
    }

    catch (e) {
      window[callbackName] = undefined;
    }

  };


  document.body.appendChild(script);

}


/* ==================================================
   DISPLAY MEMBER
================================================== */

function displayMember(result) {


  document.getElementById("memberName")
    .textContent =
    result.name || "N/A";


  document.getElementById("memberId")
    .textContent =
    result.memberId || "N/A";


  document.getElementById("contact")
    .textContent =
    result.contact || "N/A";


  /* ==================================================
     CREDITS
  ================================================== */

  setCreditValue(
    "annualCredit",
    result.annualCredit,
    " Credit"
  );


  setCreditValue(
    "workoutCredit",
    result.workoutCredit,
    " Credit"
  );


  setCreditValue(
    "lockerCredit",
    result.lockerCredit,
    " Credit"
  );


  setCreditValue(
    "professionalTrainingCredit",
    result.professionalTrainingCredit,
    " Credit"
  );


  /* ==================================================
     LOGIN TIME
  ================================================== */

  document.getElementById("loginTime")
    .textContent =
    result.timestamp || "N/A";


  /* ==================================================
     SHOW MEMBER CARD
  ================================================== */

  document.getElementById("memberCard")
    .classList.add("show");


  document.getElementById("status")
    .textContent =
    "Login Successful";

  document.getElementById("status")
    .classList.remove("active");


  document.getElementById("error")
    .textContent = "";


  processingScan = false;

}


/* ==================================================
   CREDIT DISPLAY
================================================== */

function setCreditValue(
  elementId,
  value,
  suffix
) {

  const element =
    document.getElementById(elementId);


  /* Remove previous warning */

  element.classList.remove("zero-value");


  /*
    Handle empty values.

    If Apps Script returns an empty
    BF value, show N/A.
  */

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    element.textContent = "N/A";

    return;

  }


  /*
    Special text values such as:

    No PT
    No Locker
  */

  if (
    typeof value === "string" &&
    isNaN(value)
  ) {

    element.textContent = value;

    return;

  }


  /*
    Convert to number when possible
  */

  const numberValue =
    Number(value);


  if (!isNaN(numberValue)) {

    element.textContent =
      numberValue + suffix;


    /*
      Zero credit:

      RED + BLINK
    */

    if (numberValue === 0) {

      element.classList.add("zero-value");

    }

  }

  else {

    element.textContent =
      value;

  }

}


/* ==================================================
   RESET SCANNER
================================================== */

function resetScanner() {


  /* Hide member card */

  document.getElementById("memberCard")
    .classList.remove("show");


  /* Reset status */

  document.getElementById("status")
    .textContent =
    "Scan your Member QR Code";


  document.getElementById("status")
    .classList.add("active");


  /* Clear error */

  document.getElementById("error")
    .textContent = "";


  /* Clear member information */

  document.getElementById("memberName")
    .textContent = "";

  document.getElementById("memberId")
    .textContent = "";

  document.getElementById("contact")
    .textContent = "";

  document.getElementById("annualCredit")
    .textContent = "";

  document.getElementById("workoutCredit")
    .textContent = "";

  document.getElementById("lockerCredit")
    .textContent = "";

  document.getElementById("professionalTrainingCredit")
    .textContent = "";

  document.getElementById("loginTime")
    .textContent = "";


  /* Remove zero blinking */

  document.getElementById("annualCredit")
    .classList.remove("zero-value");

  document.getElementById("workoutCredit")
    .classList.remove("zero-value");

  document.getElementById("lockerCredit")
    .classList.remove("zero-value");

  document.getElementById("professionalTrainingCredit")
    .classList.remove("zero-value");


  processingScan = false;


  /* Start scanner again */

  startScanner();

}


/* ==================================================
   START WHEN PAGE LOADS
================================================== */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);

</script>


</body>

</html>
