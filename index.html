<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stay Active QR Login</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 480px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin: 5px 0;
  font-size: 30px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  background: #000;
  border-radius: 15px;
  overflow: hidden;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
}

#startButton {
  background: white;
  color: black;
}

#scanAgain {
  display: none;
  background: #333;
  color: white;
}

#status {
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
  background: #222;
}

.error {
  background: #8b1111 !important;
}

#member {
  display: none;
  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  background: #075c31;
}

.success {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 15px;
}

.member-name {
  font-size: 26px;
  font-weight: bold;
  margin: 10px 0;
}

.member-id {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 20px;
}

.info-box {
  background: rgba(0,0,0,0.25);
  border-radius: 12px;
  padding: 10px 15px;
  text-align: left;
}

.info-row {
  padding: 15px 5px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

.info-row:last-child {
  border-bottom: none;
}

.label {
  font-size: 13px;
  color: #ccc;
  text-transform: uppercase;
}

.value {
  font-size: 21px;
  font-weight: bold;
  margin-top: 5px;
}

</style>

</head>


<body>

<div class="container">

<h1>STAY ACTIVE</h1>

<div class="subtitle">
Lifestyle Fitness Gym
</div>

<h2>MEMBER LOGIN</h2>


<div id="reader"></div>


<button id="startButton"
        onclick="startScanner()">

📷 START SCANNER

</button>


<div id="status">

Press START SCANNER

</div>


<!-- MEMBER INFORMATION -->

<div id="member">

<div class="success">
✅ LOGIN SUCCESSFUL
</div>


<div class="member-name"
     id="memberName">
</div>


<div class="member-id"
     id="memberId">
</div>


<div class="info-box">


<!-- ANNUAL -->

<div class="info-row">

<div class="label">
Annual Membership Credit
</div>

<div class="value"
     id="annualCredit">
N/A
</div>

</div>


<!-- WORKOUT -->

<div class="info-row">

<div class="label">
Gym Workout Plan Credit
</div>

<div class="value"
     id="workoutCredit">
N/A
</div>

</div>


<!-- LOCKER -->

<div class="info-row">

<div class="label">
Locker Rental Credit
</div>

<div class="value"
     id="lockerCredit">
N/A
</div>

</div>


<!-- LOGIN TIME -->

<div class="info-row">

<div class="label">
Login Time
</div>

<div class="value"
     id="loginTime">
N/A
</div>

</div>


</div>

</div>


<button id="scanAgain"
        onclick="resetScanner()">

📷 SCAN NEXT MEMBER

</button>


</div>


<script>

/*
==================================================
GOOGLE APPS SCRIPT
==================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbxam82_ho5kvQZZGE7oWT5duGCnK5XXQAmJzWL7mZIp1OSX6Sk5yd63bmm7m0FZWd5m/exec";


let scanner = null;

let processing = false;


/*
==================================================
START CAMERA
==================================================
*/

function startScanner() {

  processing = false;

  document.getElementById(
    "startButton"
  ).style.display = "none";

  document.getElementById(
    "scanAgain"
  ).style.display = "none";

  document.getElementById(
    "member"
  ).style.display = "none";

  showStatus(
    "Opening camera..."
  );

  scanner =
    new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      if (processing) {
        return;
      }

      processing = true;

      processMember(
        decodedText.trim()
      );

    },

    function(errorMessage) {

      // Ignore normal QR errors

    }

  )

  .then(function() {

    showStatus(
      "📷 Scan Member QR Code"
    );

  })

  .catch(function(error) {

    showError(
      "CAMERA ERROR: " + error
    );

    document.getElementById(
      "startButton"
    ).style.display = "block";

  });

}


/*
==================================================
PROCESS QR
==================================================
*/

function processMember(memberId) {

  showStatus(
    "Checking Member ID: " +
    memberId
  );


  stopScanner(function() {

    getMemberData(memberId);

  });

}


/*
==================================================
STOP CAMERA
==================================================
*/

function stopScanner(callback) {

  if (!scanner) {

    callback();

    return;

  }


  scanner.stop()

  .then(function() {

    callback();

  })

  .catch(function() {

    callback();

  });

}


/*
==================================================
GET DATA FROM APPS SCRIPT
==================================================
*/

function getMemberData(memberId) {

  /*
  Create unique JSONP callback
  */

  const callbackName =
    "stayActive_" +
    Date.now();


  /*
  Create callback function
  */

  window[callbackName] =
    function(result) {

      console.log(
        "APPS SCRIPT RESULT:",
        result
      );


      displayMember(
        result
      );


      delete window[callbackName];

    };


  /*
  Create script element
  */

  const script =
    document.createElement(
      "script"
    );


  /*
  IMPORTANT:
  JSONP REQUEST
  */

  script.src =
    API_URL +
    "?action=login" +
    "&memberId=" +
    encodeURIComponent(
      memberId
    ) +
    "&callback=" +
    callbackName;


  /*
  Connection error
  */

  script.onerror =
    function() {

      showError(
        "Unable to connect to Apps Script."
      );

      processing = false;

      document.getElementById(
        "scanAgain"
      ).style.display =
        "block";

      delete window[callbackName];

      script.remove();

    };


  /*
  Add request to page
  */

  document.body.appendChild(
    script
  );

}


/*
==================================================
DISPLAY MEMBER
==================================================
*/

function displayMember(result) {

  console.log(
    "DISPLAY RESULT:",
    result
  );


  if (!result) {

    showError(
      "No response received."
    );

    processing = false;

    return;

  }


  if (!result.success) {

    showError(
      result.message ||
      "Member not found."
    );

    processing = false;

    document.getElementById(
      "scanAgain"
    ).style.display =
      "block";

    return;

  }


  /*
  NAME
  */

  document.getElementById(
    "memberName"
  ).innerText =
    result.name || "N/A";


  /*
  MEMBER ID
  */

  document.getElementById(
    "memberId"
  ).innerText =
    result.memberId || "N/A";


  /*
  ANNUAL MEMBERSHIP CREDIT
  */

  document.getElementById(
    "annualCredit"
  ).innerText =
    result.annualCredit !== undefined &&
    result.annualCredit !== null &&
    result.annualCredit !== ""
      ? result.annualCredit + " Days"
      : "N/A";


  /*
  WORKOUT PLAN CREDIT
  */

  document.getElementById(
    "workoutCredit"
  ).innerText =
    result.workoutCredit !== undefined &&
    result.workoutCredit !== null &&
    result.workoutCredit !== ""
      ? result.workoutCredit + " Credit"
      : "N/A";


  /*
  LOCKER CREDIT
  */

  document.getElementById(
    "lockerCredit"
  ).innerText =
    result.lockerCredit !== undefined &&
    result.lockerCredit !== null &&
    result.lockerCredit !== ""
      ? result.lockerCredit
      : "N/A";


  /*
  LOGIN TIME
  */

  document.getElementById(
    "loginTime"
  ).innerText =
    result.timestamp || "N/A";


  /*
  SHOW MEMBER
  */

  document.getElementById(
    "member"
  ).style.display =
    "block";


  /*
  HIDE STATUS
  */

  document.getElementById(
    "status"
  ).style.display =
    "none";


  /*
  SHOW SCAN AGAIN
  */

  document.getElementById(
    "scanAgain"
  ).style.display =
    "block";

}


/*
==================================================
RESET
==================================================
*/

function resetScanner() {

  processing = false;

  document.getElementById(
    "member"
  ).style.display =
    "none";

  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";

  document.getElementById(
    "startButton"
  ).style.display =
    "block";

  showStatus(
    "Press START SCANNER"
  );

}


/*
==================================================
STATUS
==================================================
*/

function showStatus(message) {

  const status =
    document.getElementById(
      "status"
    );

  status.className = "";

  status.innerText =
    message;

  status.style.display =
    "block";

}


/*
==================================================
ERROR
==================================================
*/

function showError(message) {

  const status =
    document.getElementById(
      "status"
    );

  status.className =
    "error";

  status.innerText =
    message;

  status.style.display =
    "block";

}

</script>

</body>

</html>
