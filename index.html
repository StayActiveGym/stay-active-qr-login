<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Stay Active | Login</title>

  <!-- QR SCANNER LIBRARY -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f3f3f3;
      color: #222;
    }


    .container {
      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      padding: 20px;
    }


    /* ==========================================
       HEADER
       ========================================== */

    .header {
      text-align: center;
      margin-bottom: 20px;
    }


    .header h1 {
      margin: 0;

      font-size: 28px;
      font-weight: 800;
    }


    .header p {
      margin: 5px 0 0;

      color: #777;

      font-size: 14px;

      letter-spacing: 1px;
    }


    /* ==========================================
       SCANNER
       ========================================== */

    .scanner-title {
      text-align: center;

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 12px;
    }


    #reader {
      width: 100%;

      background: #000;

      border-radius: 16px;

      overflow: hidden;
    }


    #status {
      text-align: center;

      margin-top: 12px;

      font-size: 14px;

      color: #666;
    }


    /* ==========================================
       MEMBER CARD
       ========================================== */

    #memberCard {
      display: none;

      margin-top: 20px;

      background: #fff;

      border-radius: 18px;

      padding: 22px;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.10);
    }


    .success {
      text-align: center;

      font-size: 23px;

      font-weight: bold;

      margin-bottom: 6px;
    }


    .timestamp {
      text-align: center;

      color: #777;

      font-size: 13px;

      margin-bottom: 20px;
    }


    .row {
      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 15px;

      padding: 12px 0;

      border-bottom:
        1px solid #eee;
    }


    .label {
      color: #777;

      font-size: 13px;

      font-weight: bold;

      flex: 1;
    }


    .value {
      text-align: right;

      font-size: 15px;

      font-weight: bold;

      flex: 1.5;

      word-break: break-word;
    }


    /* ==========================================
       ERROR CARD
       ========================================== */

    #errorCard {
      display: none;

      margin-top: 20px;

      background: #fff;

      border-radius: 18px;

      padding: 25px;

      text-align: center;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.10);
    }


    .errorTitle {
      font-size: 22px;

      font-weight: bold;

      margin-bottom: 8px;
    }


    .errorMessage {
      color: #777;

      margin-bottom: 20px;
    }


    /* ==========================================
       BUTTON
       ========================================== */

    button {
      width: 100%;

      border: none;

      border-radius: 10px;

      padding: 14px;

      font-size: 15px;

      font-weight: bold;

      background: #222;

      color: white;

      cursor: pointer;
    }


    button:active {
      transform: scale(0.98);
    }


    /* ==========================================
       MOBILE
       ========================================== */

    @media (max-width: 480px) {

      .container {
        padding: 12px;
      }


      .header h1 {
        font-size: 24px;
      }


      .row {
        display: block;
      }


      .value {
        text-align: left;

        margin-top: 4px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- ==========================================
       HEADER
       ========================================== -->

  <div class="header">

    <h1>
      STAY ACTIVE
    </h1>

    <p>
      LIFESTYLE FITNESS GYM
    </p>

  </div>


  <!-- ==========================================
       SCANNER
       ========================================== -->

  <div id="scannerSection">

    <div class="scanner-title">
      SCAN MEMBER QR CODE
    </div>


    <div id="reader"></div>


    <div id="status">
      Starting camera...
    </div>

  </div>


  <!-- ==========================================
       MEMBER RESULT
       ========================================== -->

  <div id="memberCard">


    <div class="success">
      LOGIN SUCCESSFUL
    </div>


    <div
      id="timestamp"
      class="timestamp">
    </div>


    <!-- MEMBER ID -->

    <div class="row">

      <div class="label">
        MEMBER ID
      </div>

      <div
        id="memberId"
        class="value">
      </div>

    </div>


    <!-- NAME -->

    <div class="row">

      <div class="label">
        NAME
      </div>

      <div
        id="name"
        class="value">
      </div>

    </div>


    <!-- CONTACT -->

    <div class="row">

      <div class="label">
        CONTACT
      </div>

      <div
        id="contact"
        class="value">
      </div>

    </div>


    <!-- ANNUAL MEMBERSHIP -->

    <div class="row">

      <div class="label">
        ANNUAL MEMBERSHIP
      </div>

      <div
        id="annualMembership"
        class="value">
      </div>

    </div>


    <!-- GYM WORKOUT PLAN -->

    <div class="row">

      <div class="label">
        GYM WORKOUT PLAN
      </div>

      <div
        id="workoutPlan"
        class="value">
      </div>

    </div>


    <!-- GYM WORKOUT PLAN CREDIT -->

    <div class="row">

      <div class="label">
        GYM WORKOUT PLAN CREDIT
      </div>

      <div
        id="workoutCredit"
        class="value">
      </div>

    </div>


    <!-- LOCKER RENTAL CREDIT -->

    <div class="row">

      <div class="label">
        LOCKER RENTAL CREDIT
      </div>

      <div
        id="lockerCredit"
        class="value">
      </div>

    </div>


    <br>


    <button
      onclick="scanNext()">

      SCAN NEXT MEMBER

    </button>


  </div>


  <!-- ==========================================
       ERROR
       ========================================== -->

  <div id="errorCard">


    <div class="errorTitle">
      LOGIN FAILED
    </div>


    <div
      id="errorMessage"
      class="errorMessage">
    </div>


    <button
      onclick="scanNext()">

      TRY AGAIN

    </button>


  </div>


</div>



<script>


/* =====================================================
   GOOGLE APPS SCRIPT API
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxmExZ3kNnKXWs2ahZtISpDibCpEDLQLB7mq6WjtmdehP1iN7M8VQq2h5-RaX7lyVp2/exec";



/* =====================================================
   VARIABLES
   ===================================================== */

let scanner = null;

let scanning = false;

let processing = false;



/* =====================================================
   START SCANNER
   ===================================================== */

function startScanner() {

  processing = false;


  document
    .getElementById("status")
    .textContent =
      "Requesting camera access...";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  /*
   * GET AVAILABLE CAMERAS
   */

  Html5Qrcode
    .getCameras()

    .then(function(cameras) {


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "No camera was detected."
        );

      }


      /*
       * DEFAULT CAMERA
       */

      let cameraId =
        cameras[0].id;


      /*
       * FIND REAR CAMERA
       */

      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          (
            cameras[i].label ||
            ""
          ).toLowerCase();


        if (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        ) {

          cameraId =
            cameras[i].id;

          break;

        }

      }


      /*
       * SCANNER CONFIG
       */

      const config = {

        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );


          return {

            width: size,

            height: size

          };

        },

        aspectRatio: 1.0

      };


      document
        .getElementById("status")
        .textContent =
          "Opening camera...";


      /*
       * START CAMERA
       */

      return scanner.start(

        cameraId,

        config,

        onScanSuccess,

        onScanFailure

      );

    })


    .then(function() {

      scanning = true;


      document
        .getElementById("status")
        .textContent =
          "Ready — scan member QR code";

    })


    .catch(function(error) {

      console.error(
        "Camera error:",
        error
      );


      document
        .getElementById("status")
        .textContent =
          "Camera could not start.";


      showError(
        "Camera could not start. Please allow camera permission and reload the page."
      );

    });

}



/* =====================================================
   QR SCAN SUCCESS
   ===================================================== */

function onScanSuccess(
  decodedText,
  decodedResult
) {


  if (processing) {

    return;

  }


  processing = true;


  const memberId =
    String(
      decodedText || ""
    ).trim();


  if (!memberId) {

    processing = false;

    return;

  }


  /*
   * STOP CAMERA
   */

  stopScanner();


  document
    .getElementById("status")
    .textContent =
      "Processing login...";


  /*
   * BUILD API URL
   */

  const url =
    API_URL +
    "?memberId=" +
    encodeURIComponent(
      memberId
    );


  /*
   * CALL APPS SCRIPT
   */

  fetch(url)

    .then(function(response) {

      if (!response.ok) {

        throw new Error(
          "Network error: " +
          response.status
        );

      }


      return response.json();

    })


    .then(function(data) {

      handleResult(data);

    })


    .catch(function(error) {

      console.error(
        "API error:",
        error
      );


      showError(
        "Unable to connect to the Login Server."
      );

    });

}



/* =====================================================
   QR SCAN FAILURE
   ===================================================== */

function onScanFailure(error) {

  /*
   * Normal QR scanning failures are ignored.
   */

}



/* =====================================================
   HANDLE API RESULT
   ===================================================== */

function handleResult(
  data
) {


  if (!data) {

    showError(
      "No response received from the server."
    );

    return;

  }


  if (!data.success) {

    showError(
      data.message ||
      "Member login failed."
    );

    return;

  }


  /*
   * MEMBER ID
   */

  document
    .getElementById("memberId")
    .textContent =
      data.memberId || "";


  /*
   * NAME
   */

  document
    .getElementById("name")
    .textContent =
      data.name || "";


  /*
   * CONTACT
   */

  document
    .getElementById("contact")
    .textContent =
      data.contact || "";


  /*
   * ANNUAL MEMBERSHIP
   */

  document
    .getElementById("annualMembership")
    .textContent =
      data.annualMembership || "0";


  /*
   * GYM WORKOUT PLAN
   */

  document
    .getElementById("workoutPlan")
    .textContent =
      data.workoutPlan || "";


  /*
   * GYM WORKOUT PLAN CREDIT
   */

  document
    .getElementById("workoutCredit")
    .textContent =
      data.workoutCredit ?? 0;


  /*
   * LOCKER RENTAL CREDIT
   */

  document
    .getElementById("lockerCredit")
    .textContent =
      data.lockerCredit ?? 0;


  /*
   * TIMESTAMP
   */

  document
    .getElementById("timestamp")
    .textContent =
      data.timestamp || "";


  /*
   * SHOW MEMBER CARD
   */

  document
    .getElementById("memberCard")
    .style.display =
      "block";


  document
    .getElementById("status")
    .textContent =
      "";

}



/* =====================================================
   SHOW ERROR
   ===================================================== */

function showError(
  message
) {


  document
    .getElementById("errorMessage")
    .textContent =
      message;


  document
    .getElementById("errorCard")
    .style.display =
      "block";


  document
    .getElementById("status")
    .textContent =
      "";

}



/* =====================================================
   STOP SCANNER
   ===================================================== */

function stopScanner() {


  if (
    scanner &&
    scanning
  ) {

    scanner
      .stop()

      .then(function() {

        scanning = false;

      })

      .catch(function(error) {

        console.log(
          "Stop scanner error:",
          error
        );

        scanning = false;

      });

  }

}



/* =====================================================
   SCAN NEXT MEMBER
   ===================================================== */

function scanNext() {


  processing = false;


  /*
   * HIDE MEMBER CARD
   */

  document
    .getElementById("memberCard")
    .style.display =
      "none";


  /*
   * HIDE ERROR
   */

  document
    .getElementById("errorCard")
    .style.display =
      "none";


  /*
   * CLEAR OLD SCANNER
   */

  if (scanner) {

    try {

      scanner.clear();

    } catch (error) {

      console.log(error);

    }

  }


  /*
   * START NEW SCAN
   */

  setTimeout(
    function() {

      startScanner();

    },
    300
  );

}



/* =====================================================
   PAGE LOAD
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);


</script>


</body>

</html>
