<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Stay Active QR Login</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: white;
      color: black;
    }

    #scanAgain {
      background: #333;
      color: white;
      display: none;
    }

    .status {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #222;
    }

    .error {
      background: #8b1111;
    }

    .member {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      background: #075c31;
    }

    .member-name {
      font-size: 25px;
      font-weight: bold;
      margin: 10px 0;
    }

    .member-id {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .info-box {
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      padding: 15px;
      text-align: left;
    }

    .info-row {
      padding: 12px 5px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-size: 13px;
      color: #ccc;
      text-transform: uppercase;
    }

    .info-value {
      font-size: 19px;
      font-weight: bold;
      margin-top: 4px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>STAY ACTIVE</h1>

  <div class="subtitle">
    Lifestyle Fitness Gym
  </div>

  <h2>MEMBER LOGIN</h2>


  <!-- CAMERA -->

  <div id="reader"></div>


  <button id="startButton"
          onclick="startScanner()">

    📷 START SCANNER

  </button>


  <!-- STATUS -->

  <div id="status"
       class="status">

    Press START SCANNER

  </div>


  <!-- =====================================
       MEMBER INFORMATION
  ====================================== -->

  <div id="member"
       class="member">

    <h2>✅ LOGIN SUCCESSFUL</h2>


    <div class="member-name"
         id="memberName">
    </div>


    <div class="member-id"
         id="memberId">
    </div>


    <div class="info-box">


      <!-- ANNUAL MEMBERSHIP -->

      <div class="info-row">

        <div class="info-label">
          Annual Membership Credit
        </div>

        <div class="info-value"
             id="annualCredit">
          -
        </div>

      </div>


      <!-- WORKOUT PLAN -->

      <div class="info-row">

        <div class="info-label">
          Workout Plan
        </div>

        <div class="info-value"
             id="workoutPlan">
          -
        </div>

      </div>


      <!-- WORKOUT CREDIT -->

      <div class="info-row">

        <div class="info-label">
          Workout Plan Credit
        </div>

        <div class="info-value"
             id="workoutCredit">
          -
        </div>

      </div>


      <!-- LOCKER CREDIT -->

      <div class="info-row">

        <div class="info-label">
          Locker Rental Credit
        </div>

        <div class="info-value"
             id="lockerCredit">
          -
        </div>

      </div>


      <!-- LOGIN TIME -->

      <div class="info-row">

        <div class="info-label">
          Login Time
        </div>

        <div class="info-value"
             id="loginTime">
          -
        </div>

      </div>


    </div>

  </div>


  <!-- SCAN NEXT -->

  <button id="scanAgain"
          onclick="resetScanner()">

    SCAN NEXT MEMBER

  </button>

</div>


<script>


/*
=================================================
GOOGLE APPS SCRIPT
=================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbzc9l70JiwHwPSWLM2jI-N1kkY6Eonj6SpEEJLpv__3chsqwNe2dcoTpuPqC-yjFkGx/exec";


let scanner = null;

let processing = false;


/*
=================================================
START SCANNER
=================================================
*/

function startScanner() {

  if (processing) {
    return;
  }


  document.getElementById(
    "startButton"
  ).style.display = "none";


  document.getElementById(
    "scanAgain"
  ).style.display = "none";


  document.getElementById(
    "member"
  ).style.display = "none";


  showStatus(
    "Requesting camera..."
  );


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    onScanSuccess,

    onScanError

  )

  .then(function() {

    showStatus(
      "📷 Scan Member QR Code"
    );

  })

  .catch(function(error) {

    showError(
      "CAMERA ERROR: " + error
    );


    document.getElementById(
      "startButton"
    ).style.display = "block";

  });

}


/*
=================================================
QR SCANNED
=================================================
*/

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }


  processing = true;


  const memberId =
    decodedText.trim();


  showStatus(
    "Checking Member ID..."
  );


  scanner.stop()

    .then(function() {

      loginMember(memberId);

    })

    .catch(function() {

      loginMember(memberId);

    });

}


/*
=================================================
LOGIN MEMBER
=================================================
*/

function loginMember(memberId) {

  const callbackName =
    "loginCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      handleLogin(result);


      delete window[callbackName];


      const script =
        document.getElementById(
          callbackName
        );


      if (script) {
        script.remove();
      }

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?action=login" +
    "&memberId=" +
    encodeURIComponent(memberId) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      showError(
        "Unable to connect to server."
      );


      delete window[callbackName];


      script.remove();


      processing = false;


      document.getElementById(
        "scanAgain"
      ).style.display =
        "block";

    };


  document.body.appendChild(script);

}


/*
=================================================
DISPLAY MEMBER
=================================================
*/

function handleLogin(result) {

  console.log(
    "LOGIN RESULT:",
    result
  );


  /*
   LOGIN FAILED
  */

  if (
    !result ||
    result.success !== true
  ) {

    showError(
      result && result.message
        ? result.message
        : "Login failed."
    );


    processing = false;


    document.getElementById(
      "scanAgain"
    ).style.display =
      "block";


    return;

  }


  /*
   HIDE STATUS
  */

  document.getElementById(
    "status"
  ).style.display =
    "none";


  /*
   SHOW MEMBER PANEL
  */

  document.getElementById(
    "member"
  ).style.display =
    "block";


  /*
   MEMBER NAME
  */

  document.getElementById(
    "memberName"
  ).innerText =
    result.name || "-";


  /*
   MEMBER ID

   Supports both:
   memberId
   memberID
  */

  document.getElementById(
    "memberId"
  ).innerText =
    result.memberId ||
    result.memberID ||
    "-";


  /*
   ANNUAL MEMBERSHIP CREDIT
  */

  document.getElementById(
    "annualCredit"
  ).innerText =
    formatCredit(
      result.annualCredit,
      "Days"
    );


  /*
   WORKOUT PLAN
  */

  document.getElementById(
    "workoutPlan"
  ).innerText =
    result.workoutPlan ||
    "N/A";


  /*
   WORKOUT PLAN CREDIT
  */

  if (
    result.workoutPlan ===
    "Per Session"
  ) {

    document.getElementById(
      "workoutCredit"
    ).innerText =
      "1 Credit";

  } else {

    document.getElementById(
      "workoutCredit"
    ).innerText =
      formatCredit(
        result.workoutCredit,
        "Days"
      );

  }


  /*
   LOCKER RENTAL CREDIT
  */

  if (
    result.lockerCredit ===
    "No Locker"
  ) {

    document.getElementById(
      "lockerCredit"
    ).innerText =
      "No Locker";

  } else {

    document.getElementById(
      "lockerCredit"
    ).innerText =
      formatCredit(
        result.lockerCredit,
        "Days"
      );

  }


  /*
   LOGIN TIME
  */

  document.getElementById(
    "loginTime"
  ).innerText =
    result.timestamp ||
    "-";


  /*
   SHOW SCAN AGAIN
  */

  document.getElementById(
    "scanAgain"
  ).style.display =
    "block";

}


/*
=================================================
FORMAT CREDIT
=================================================
*/

function formatCredit(
  value,
  unit
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "N/A";

  }


  return value + " " + unit;

}


/*
=================================================
RESET
=================================================
*/

function resetScanner() {

  processing = false;


  document.getElementById(
    "member"
  ).style.display =
    "none";


  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";


  document.getElementById(
    "startButton"
  ).style.display =
    "block";


  showStatus(
    "Press START SCANNER"
  );

}


/*
=================================================
STATUS
=================================================
*/

function showStatus(message) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "status";


  status.innerText =
    message;


  status.style.display =
    "block";

}


/*
=================================================
ERROR
=================================================
*/

function showError(message) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "status error";


  status.innerText =
    message;


  status.style.display =
    "block";

}


/*
=================================================
NORMAL QR SCANNING ERRORS
=================================================
*/

function onScanError(errorMessage) {

  // Ignore normal scanning errors.

}

</script>

</body>

</html>
