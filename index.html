<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stay Active QR Login</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

/* ==================================================
   GENERAL
================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}


/* ==================================================
   MAIN CONTAINER
================================================== */

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 20px;
}


/* ==================================================
   HEADER
================================================== */

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 1px;
}

.header span {
  color: #ffd400;
}


/* ==================================================
   OPENING SCREEN
================================================== */

.start-screen {
  text-align: center;
  padding: 35px 15px;
}


/* ==================================================
   START ICON
================================================== */

.qr-icon {
  width: 110px;
  height: 110px;

  margin: 10px auto 25px auto;

  border: 4px solid #ffd400;
  border-radius: 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 55px;

  color: #ffd400;

  background: #111;
}


/* ==================================================
   START MESSAGE
================================================== */

.start-title {
  font-size: 25px;
  font-weight: 900;
  margin-bottom: 10px;
}

.start-subtitle {
  color: #888;
  font-size: 15px;
  margin-bottom: 30px;
}


/* ==================================================
   SCAN MEMBER BUTTON
================================================== */

.start-button {

  width: 100%;
  max-width: 450px;

  padding: 18px 20px;

  border: none;
  border-radius: 12px;

  background: #ffd400;
  color: #000;

  font-size: 20px;
  font-weight: 900;

  cursor: pointer;

  transition: 0.2s;
}

.start-button:hover {
  background: #fff;
  transform: scale(1.01);
}


/* ==================================================
   SCANNER SCREEN
================================================== */

.scanner-screen {
  display: none;
}


/* ==================================================
   SCANNER
================================================== */

#reader {

  width: 100%;
  max-width: 500px;

  margin: 0 auto 20px auto;

  border: 3px solid #ffd400 !important;

  border-radius: 15px;

  overflow: hidden;

  background: #111;
}


/* ==================================================
   SCANNER STATUS
================================================== */

.status {

  text-align: center;

  font-size: 18px;
  font-weight: 800;

  color: #ffd400;

  margin: 15px 0;
}


/* ==================================================
   ERROR
================================================== */

.error {

  color: #ff3333;

  text-align: center;

  font-weight: 700;

  margin-top: 15px;
}


/* ==================================================
   MEMBER CARD
================================================== */

.member-card {

  display: none;

  background: #111;

  border: 1px solid #333;

  border-radius: 15px;

  padding: 20px;

  margin-top: 20px;
}

.member-card.show {
  display: block;
}


/* ==================================================
   MEMBER NAME
================================================== */

.member-name {

  text-align: center;

  font-size: 28px;

  font-weight: 900;

  color: #ffd400;

  margin-bottom: 20px;

  word-break: break-word;
}


/* ==================================================
   INFORMATION ROW
================================================== */

.info-row {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;

  padding: 13px 0;

  border-bottom: 1px solid #292929;
}

.info-row:last-child {
  border-bottom: none;
}


.label {

  color: #999;

  font-size: 15px;
}


.value {

  color: #fff;

  font-size: 17px;

  font-weight: 800;

  text-align: right;

  word-break: break-word;
}


/* ==================================================
   ZERO CREDIT WARNING
================================================== */

.zero-value {

  color: #ff2222 !important;

  animation: blinkZero 0.8s infinite;
}


@keyframes blinkZero {

  0% {
    opacity: 1;
  }

  50% {
    opacity: 0.15;
  }

  100% {
    opacity: 1;
  }

}


/* ==================================================
   SCAN ANOTHER MEMBER BUTTON
================================================== */

.scan-another {

  width: 100%;

  margin-top: 25px;

  padding: 16px;

  border: none;

  border-radius: 10px;

  background: #ffd400;

  color: #000;

  font-size: 18px;

  font-weight: 900;

  cursor: pointer;
}

.scan-another:hover {
  background: #fff;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 500px) {

  .container {
    padding: 12px;
  }

  .header h1 {
    font-size: 27px;
  }

  .qr-icon {
    width: 90px;
    height: 90px;
    font-size: 45px;
  }

  .start-title {
    font-size: 22px;
  }

  .start-button {
    font-size: 18px;
  }

  .member-name {
    font-size: 23px;
  }

  .label {
    font-size: 13px;
  }

  .value {
    font-size: 15px;
  }

}

</style>

</head>


<body>


<div class="container">


  <!-- ==================================================
       HEADER
  ================================================== -->

  <div class="header">

    <h1>
      STAY <span>ACTIVE</span>
    </h1>

  </div>


  <!-- ==================================================
       OPENING SCREEN
  ================================================== -->

  <div id="startScreen"
       class="start-screen">


    <div class="qr-icon">
      ▦
    </div>


    <div class="start-title">
      MEMBER LOGIN
    </div>


    <div class="start-subtitle">
      Scan your Stay Active Member QR Code
    </div>


    <button class="start-button"
            onclick="openScanner()">

      SCAN MEMBER QR CODE

    </button>


  </div>



  <!-- ==================================================
       SCANNER SCREEN
  ================================================== -->

  <div id="scannerScreen"
       class="scanner-screen">


    <div id="reader"></div>


    <div id="status"
         class="status">

      Scan your Member QR Code

    </div>


    <div id="error"
         class="error">
    </div>


  </div>



  <!-- ==================================================
       MEMBER INFORMATION
  ================================================== -->

  <div id="memberCard"
       class="member-card">


    <!-- MEMBER NAME -->

    <div id="memberName"
         class="member-name">
    </div>


    <!-- MEMBER ID -->

    <div class="info-row">

      <div class="label">
        Member ID
      </div>

      <div id="memberId"
           class="value">
      </div>

    </div>


    <!-- ANNUAL MEMBERSHIP CREDIT -->

    <div class="info-row">

      <div class="label">
        Annual Membership Credit
      </div>

      <div id="annualCredit"
           class="value">
      </div>

    </div>


    <!-- GYM WORKOUT PLAN CREDIT -->

    <div class="info-row">

      <div class="label">
        Gym Workout Plan Credit
      </div>

      <div id="workoutCredit"
           class="value">
      </div>

    </div>


    <!-- LOCKER RENTAL CREDIT -->

    <div class="info-row">

      <div class="label">
        Locker Rental Credit
      </div>

      <div id="lockerCredit"
           class="value">
      </div>

    </div>


    <!-- PROFESSIONAL TRAINING CREDIT -->

    <div class="info-row">

      <div class="label">
        Professional Training Credit
      </div>

      <div id="professionalTrainingCredit"
           class="value">
      </div>

    </div>


    <!-- LOGIN TIME -->

    <div class="info-row">

      <div class="label">
        Login Time
      </div>

      <div id="loginTime"
           class="value">
      </div>

    </div>


    <!-- SCAN ANOTHER MEMBER -->

    <button class="scan-another"
            onclick="scanAnotherMember()">

      SCAN ANOTHER MEMBER

    </button>


  </div>


</div>



<script>

/* ==================================================
   APPS SCRIPT WEB APP URL
================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyXNaie8FuJlwr1fWbACn-70mxSqGAJBrpE2DN82yuaAp4YbHEaBcgRLT0gsqBMmQAA/exec";


/* ==================================================
   SCANNER VARIABLES
================================================== */

let html5QrCode = null;

let scannerRunning = false;

let processingScan = false;


/* ==================================================
   OPEN SCANNER
================================================== */

function openScanner() {


  /* Hide opening screen */

  document.getElementById("startScreen")
    .style.display = "none";


  /* Show scanner */

  document.getElementById("scannerScreen")
    .style.display = "block";


  /* Reset status */

  document.getElementById("status")
    .textContent =
    "Scan your Member QR Code";


  document.getElementById("error")
    .textContent = "";


  processingScan = false;


  startScanner();

}


/* ==================================================
   START CAMERA
================================================== */

function startScanner() {


  /* Prevent duplicate scanners */

  if (scannerRunning) {
    return;
  }


  html5QrCode =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox:
      function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const size =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.70;


        return {

          width: size,

          height: size

        };

      },

    aspectRatio: 1.0

  };


  html5QrCode

    .start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(function() {

      scannerRunning = true;

    })

    .catch(function(error) {

      scannerRunning = false;


      document.getElementById("error")
        .textContent =
        "Unable to start camera. Please allow camera access.";


      console.error(error);

    });

}


/* ==================================================
   SCAN SUCCESS
================================================== */

function onScanSuccess(decodedText) {


  if (processingScan) {
    return;
  }


  processingScan = true;


  const memberId =
    String(decodedText).trim();


  document.getElementById("status")
    .textContent =
    "Checking member...";


  document.getElementById("error")
    .textContent = "";


  /* Stop camera */

  if (
    html5QrCode &&
    scannerRunning
  ) {


    html5QrCode

      .stop()

      .then(function() {

        scannerRunning = false;

        lookupMember(memberId);

      })

      .catch(function() {

        scannerRunning = false;

        lookupMember(memberId);

      });


  }

  else {

    lookupMember(memberId);

  }

}


/* ==================================================
   SCAN FAILURE
================================================== */

function onScanFailure(error) {

  /*
    Normal QR scanning failures
    are ignored.
  */

}


/* ==================================================
   LOOKUP MEMBER
================================================== */

function lookupMember(memberId) {


  const callbackName =
    "stayActiveCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {


      /* Remove JSONP script */

      const script =
        document.getElementById(
          callbackName
        );


      if (script) {
        script.remove();
      }


      /* Remove callback */

      try {

        delete window[callbackName];

      }

      catch (e) {

        window[callbackName] =
          undefined;

      }


      /* Check result */

      if (
        result &&
        result.success
      ) {

        displayMember(result);

      }

      else {


        document.getElementById("status")
          .textContent =
          "Member Not Found";


        document.getElementById("error")
          .textContent =

          result &&
          result.message

            ? result.message

            : "Unable to find member.";


        processingScan = false;


        setTimeout(function() {

          scanAnotherMember();

        }, 2500);

      }

    };


  /* Create JSONP script */

  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =

    API_URL +

    "?action=login" +

    "&memberId=" +

    encodeURIComponent(memberId) +

    "&callback=" +

    callbackName;


  /* Connection error */

  script.onerror =
    function() {


      document.getElementById("status")
        .textContent =
        "Connection Error";


      document.getElementById("error")
        .textContent =
        "Unable to connect to the member database.";


      processingScan = false;


      script.remove();


      try {

        delete window[callbackName];

      }

      catch (e) {

        window[callbackName] =
          undefined;

      }

    };


  document.body.appendChild(script);

}


/* ==================================================
   DISPLAY MEMBER
================================================== */

function displayMember(result) {


  /* MEMBER NAME */

  document.getElementById("memberName")
    .textContent =
    result.name || "N/A";


  /* MEMBER ID */

  document.getElementById("memberId")
    .textContent =
    result.memberId || "N/A";


  /* ANNUAL MEMBERSHIP */

  setCreditValue(

    "annualCredit",

    result.annualCredit,

    " Credit"

  );


  /* WORKOUT PLAN */

  setCreditValue(

    "workoutCredit",

    result.workoutCredit,

    " Credit"

  );


  /* LOCKER */

  setCreditValue(

    "lockerCredit",

    result.lockerCredit,

    " Credit"

  );


  /* PROFESSIONAL TRAINING */

  setCreditValue(

    "professionalTrainingCredit",

    result.professionalTrainingCredit,

    " Credit"

  );


  /* LOGIN TIME */

  document.getElementById("loginTime")
    .textContent =
    result.timestamp || "N/A";


  /* Hide scanner */

  document.getElementById("scannerScreen")
    .style.display = "none";


  /* Show member card */

  document.getElementById("memberCard")
    .classList.add("show");


  /* IMPORTANT:
     This is the message after
     successful QR scanning.
  */

  document.getElementById("status")
    .textContent =
    "LOG-IN SUCCESSFUL";


  processingScan = false;

}


/* ==================================================
   DISPLAY CREDIT
================================================== */

function setCreditValue(

  elementId,

  value,

  suffix

) {


  const element =
    document.getElementById(
      elementId
    );


  /* Remove previous blink */

  element.classList.remove(
    "zero-value"
  );


  /* Empty */

  if (

    value === undefined ||

    value === null ||

    value === ""

  ) {

    element.textContent = "N/A";

    return;

  }


  /* Text value

     Examples:
     No PT
     No Locker
  */

  if (

    typeof value === "string" &&

    isNaN(value)

  ) {

    element.textContent = value;

    return;

  }


  /* Convert to number */

  const numberValue =
    Number(value);


  if (!isNaN(numberValue)) {


    element.textContent =
      numberValue + suffix;


    /* Zero = red + blinking */

    if (numberValue === 0) {

      element.classList.add(
        "zero-value"
      );

    }

  }

  else {

    element.textContent =
      value;

  }

}


/* ==================================================
   SCAN ANOTHER MEMBER
================================================== */

function scanAnotherMember() {


  /* Stop scanner if still running */

  if (
    html5QrCode &&
    scannerRunning
  ) {


    html5QrCode
      .stop()
      .then(function() {

        scannerRunning = false;

        returnToStartScreen();

      })
      .catch(function() {

        scannerRunning = false;

        returnToStartScreen();

      });


  }

  else {

    returnToStartScreen();

  }

}


/* ==================================================
   RETURN TO OPENING SCREEN
================================================== */

function returnToStartScreen() {


  /* Hide scanner */

  document.getElementById("scannerScreen")
    .style.display = "none";


  /* Hide member card */

  document.getElementById("memberCard")
    .classList.remove("show");


  /* Show opening screen */

  document.getElementById("startScreen")
    .style.display = "block";


  /* Clear member data */

  document.getElementById("memberName")
    .textContent = "";


  document.getElementById("memberId")
    .textContent = "";


  document.getElementById("annualCredit")
    .textContent = "";


  document.getElementById("workoutCredit")
    .textContent = "";


  document.getElementById("lockerCredit")
    .textContent = "";


  document.getElementById(
    "professionalTrainingCredit"
  )
    .textContent = "";


  document.getElementById("loginTime")
    .textContent = "";


  /* Remove zero blinking */

  document.getElementById("annualCredit")
    .classList.remove("zero-value");


  document.getElementById("workoutCredit")
    .classList.remove("zero-value");


  document.getElementById("lockerCredit")
    .classList.remove("zero-value");


  document.getElementById(
    "professionalTrainingCredit"
  )
    .classList.remove("zero-value");


  document.getElementById("error")
    .textContent = "";


  document.getElementById("status")
    .textContent =
    "Scan your Member QR Code";


  processingScan = false;


  html5QrCode = null;

}


/* ==================================================
   PAGE LOAD
================================================== */

window.addEventListener(
  "load",
  function() {

    /*
      IMPORTANT:
      Camera is NOT started here.

      Staff must press:
      SCAN MEMBER QR CODE
    */

  }
);

</script>


</body>

</html>
