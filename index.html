<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Stay Active - Member Login</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    h2 {
      margin: 10px 0 20px;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #fff;
      color: #111;
    }

    #scanAgain {
      display: none;
      background: #333;
      color: #fff;
    }

    #status {
      margin-top: 15px;
      padding: 15px;
      background: #222;
      border-radius: 10px;
    }

    .error {
      background: #8b1111 !important;
    }

    #member {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #075c31;
      border-radius: 15px;
    }

    .success {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .member-name {
      font-size: 27px;
      font-weight: bold;
      margin: 10px 0;
    }

    .member-id {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .info-box {
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 10px 15px;
      text-align: left;
    }

    .info-row {
      padding: 15px 5px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      font-size: 13px;
      color: #ccc;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .value {
      font-size: 21px;
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>STAY ACTIVE</h1>

  <div class="subtitle">
    Lifestyle Fitness Gym
  </div>

  <h2>MEMBER LOGIN</h2>


  <!-- QR SCANNER -->

  <div id="reader"></div>


  <!-- START BUTTON -->

  <button id="startButton"
          onclick="startScanner()">

    📷 START SCANNER

  </button>


  <!-- STATUS -->

  <div id="status">

    Press START SCANNER

  </div>


  <!-- MEMBER RESULT -->

  <div id="member">

    <div class="success">
      ✅ LOGIN SUCCESSFUL
    </div>

    <div class="member-name"
         id="memberName">
    </div>

    <div class="member-id"
         id="memberId">
    </div>


    <div class="info-box">


      <!-- ANNUAL MEMBERSHIP -->

      <div class="info-row">

        <div class="label">
          Annual Membership Credit
        </div>

        <div class="value"
             id="annualCredit">
          N/A
        </div>

      </div>


      <!-- WORKOUT CREDIT -->

      <div class="info-row">

        <div class="label">
          Gym Workout Plan Credit
        </div>

        <div class="value"
             id="workoutCredit">
          N/A
        </div>

      </div>


      <!-- LOCKER -->

      <div class="info-row">

        <div class="label">
          Locker Rental Credit
        </div>

        <div class="value"
             id="lockerCredit">
          N/A
        </div>

      </div>


      <!-- LOGIN TIME -->

      <div class="info-row">

        <div class="label">
          Login Time
        </div>

        <div class="value"
             id="loginTime">
          N/A
        </div>

      </div>


    </div>

  </div>


  <!-- SCAN AGAIN -->

  <button id="scanAgain"
          onclick="scanAgain()">

    📷 SCAN NEXT MEMBER

  </button>

</div>


<script>


/*
=================================================
NEW WORKING GOOGLE APPS SCRIPT
=================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbxdsCpfbiwcsWbhHN0mM7O5CkAjBNSzo4lapNmrywVTcPmEuCCQ4EfrXGhlQy8Oy_HL/exec";


let html5QrCode = null;

let alreadyScanned = false;


/*
=================================================
START SCANNER
=================================================
*/

function startScanner() {

  alreadyScanned = false;


  document.getElementById(
    "startButton"
  ).style.display = "none";


  document.getElementById(
    "scanAgain"
  ).style.display = "none";


  document.getElementById(
    "member"
  ).style.display = "none";


  showStatus(
    "Opening camera..."
  );


  html5QrCode =
    new Html5Qrcode("reader");


  html5QrCode.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      if (alreadyScanned) {
        return;
      }

      alreadyScanned = true;

      handleQRCode(decodedText);

    },

    function(errorMessage) {

      // Ignore normal scanning errors

    }

  )

  .then(function() {

    showStatus(
      "📷 Scan Member QR Code"
    );

  })

  .catch(function(error) {

    showError(
      "CAMERA ERROR: " + error
    );

    document.getElementById(
      "startButton"
    ).style.display = "block";

  });

}


/*
=================================================
QR CODE
=================================================
*/

function handleQRCode(decodedText) {

  const memberId =
    decodedText.trim();


  showStatus(
    "Checking " +
    memberId +
    "..."
  );


  stopCamera(function() {

    loginMember(memberId);

  });

}


/*
=================================================
STOP CAMERA
=================================================
*/

function stopCamera(callback) {

  if (!html5QrCode) {

    callback();

    return;

  }


  html5QrCode.stop()

    .then(function() {

      callback();

    })

    .catch(function() {

      callback();

    });

}


/*
=================================================
LOGIN MEMBER
=================================================
*/

function loginMember(memberId) {

  /*
  CREATE UNIQUE CALLBACK
  */

  const callbackName =
    "stayActiveCallback" +
    Date.now();


  /*
  CREATE CALLBACK FUNCTION
  */

  window[callbackName] =
    function(result) {

      console.log(
        "GOOGLE RESULT:",
        result
      );


      displayResult(result);


      delete window[callbackName];

    };


  /*
  CREATE SCRIPT
  */

  const script =
    document.createElement("script");


  /*
  JSONP URL
  */

  script.src =
    API_URL +
    "?action=login" +
    "&memberId=" +
    encodeURIComponent(memberId) +
    "&callback=" +
    callbackName;


  /*
  ERROR
  */

  script.onerror =
    function() {

      showError(
        "Unable to connect to Google Apps Script."
      );


      delete window[callbackName];


      script.remove();


      document.getElementById(
        "scanAgain"
      ).style.display =
        "block";

    };


  /*
  ADD SCRIPT TO PAGE
  */

  document.body.appendChild(script);

}


/*
=================================================
DISPLAY RESULT
=================================================
*/

function displayResult(result) {

  console.log(
    "RESULT:",
    result
  );


  if (!result) {

    showError(
      "No response received."
    );

    return;

  }


  if (!result.success) {

    showError(
      result.message ||
      "Member login failed."
    );

    document.getElementById(
      "scanAgain"
    ).style.display =
      "block";

    return;

  }


  /*
  ==========================================
  NAME
  ==========================================
  */

  document.getElementById(
    "memberName"
  ).innerText =
    result.name || "N/A";


  /*
  ==========================================
  MEMBER ID
  ==========================================
  */

  document.getElementById(
    "memberId"
  ).innerText =
    result.memberId || "N/A";


  /*
  ==========================================
  ANNUAL CREDIT
  ==========================================
  */

  document.getElementById(
    "annualCredit"
  ).innerText =
    result.annualCredit !== undefined &&
    result.annualCredit !== null &&
    result.annualCredit !== ""
      ? result.annualCredit + " Days"
      : "N/A";


  /*
  ==========================================
  WORKOUT CREDIT
  ==========================================
  */

  document.getElementById(
    "workoutCredit"
  ).innerText =
    result.workoutCredit !== undefined &&
    result.workoutCredit !== null &&
    result.workoutCredit !== ""
      ? result.workoutCredit + " Credit"
      : "N/A";


  /*
  ==========================================
  LOCKER CREDIT
  ==========================================
  */

  document.getElementById(
    "lockerCredit"
  ).innerText =
    result.lockerCredit !== undefined &&
    result.lockerCredit !== null &&
    result.lockerCredit !== ""
      ? result.lockerCredit
      : "N/A";


  /*
  ==========================================
  LOGIN TIME
  ==========================================
  */

  document.getElementById(
    "loginTime"
  ).innerText =
    result.timestamp ||
    "N/A";


  /*
  SHOW MEMBER
  */

  document.getElementById(
    "member"
  ).style.display =
    "block";


  /*
  HIDE STATUS
  */

  document.getElementById(
    "status"
  ).style.display =
    "none";


  /*
  SHOW SCAN AGAIN
  */

  document.getElementById(
    "scanAgain"
  ).style.display =
    "block";

}


/*
=================================================
SCAN AGAIN
=================================================
*/

function scanAgain() {

  alreadyScanned = false;


  document.getElementById(
    "member"
  ).style.display =
    "none";


  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";


  document.getElementById(
    "startButton"
  ).style.display =
    "block";


  showStatus(
    "Press START SCANNER"
  );

}


/*
=================================================
STATUS
=================================================
*/

function showStatus(message) {

  const status =
    document.getElementById(
      "status"
    );


  status.className = "";


  status.innerText =
    message;


  status.style.display =
    "block";

}


/*
=================================================
ERROR
=================================================
*/

function showError(message) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "error";


  status.innerText =
    message;


  status.style.display =
    "block";

}

</script>

</body>

</html>
