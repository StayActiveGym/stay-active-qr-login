<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stay Active QR Login</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 480px;
  margin: auto;
  padding: 20px;
}

/* ==========================================
   HEADER
========================================== */

h1 {
  margin: 5px 0;
  font-size: 32px;
  font-weight: 900;
  color: #FFD400;
  letter-spacing: 1px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 20px;
}

h2 {
  color: white;
  margin-bottom: 20px;
}


/* ==========================================
   QR READER
========================================== */

#reader {
  width: 100%;
  background: #111;
  border: 2px solid #FFD400;
  border-radius: 15px;
  overflow: hidden;
}


/* ==========================================
   BUTTONS
========================================== */

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#startButton {
  background: #FFD400;
  color: #000;
}

#startButton:hover {
  background: #ffe44d;
}

#scanAgain {
  display: none;
  background: #FFD400;
  color: #000;
}

#scanAgain:hover {
  background: #ffe44d;
}


/* ==========================================
   STATUS
========================================== */

#status {
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
  background: #151515;
  border: 1px solid #333;
  color: #FFD400;
}

.error {
  background: #8b1111 !important;
  border-color: #ff3333 !important;
  color: white !important;
}


/* ==========================================
   MEMBER PANEL
========================================== */

#member {

  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  background: #111;
  border: 2px solid #FFD400;
}
