<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Stay Active QR Login</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 20px;
    }

    h2 {
      margin: 10px 0 20px;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: white;
      color: black;
    }

    #scanAgain {
      background: #333;
      color: white;
      display: none;
    }

    .status {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #222;
    }

    .error {
      background: #8b1111;
    }

    .success {
      background: #075c31;
    }

    .member {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      background: #075c31;
    }

    .member-name {
      font-size: 25px;
      font-weight: bold;
      margin: 10px 0;
    }

    .member-id {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .info-box {
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      padding: 15px;
      text-align: left;
    }

    .info-row {
      padding: 13px 5px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-size: 12px;
      color: #ccc;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-value {
      font-size: 20px;
      font-weight: bold;
      margin-top: 5px;
    }

    .credit-value {
      font-size: 24px;
    }

    .login-time {
      font-size: 16px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>STAY ACTIVE</h1>

  <div class="subtitle">
    Lifestyle Fitness Gym
  </div>

  <h2>MEMBER LOGIN</h2>


  <!-- QR SCANNER -->

  <div id="reader"></div>


  <!-- START CAMERA -->

  <button
    id="startButton"
    onclick="startScanner()">

    📷 START SCANNER

  </button>


  <!-- STATUS -->

  <div
    id="status"
    class="status">

    Press START SCANNER

  </div>


  <!-- =========================================
       MEMBER INFORMATION
  ========================================== -->

  <div
    id="member"
    class="member">

    <h2>✅ LOGIN SUCCESSFUL</h2>


    <!-- NAME -->

    <div
      class="member-name"
      id="memberName">

      -

    </div>


    <!-- MEMBER ID -->

    <div
      class="member-id"
      id="memberId">

      -

    </div>


    <div class="info-box">


      <!-- CONTACT NUMBER -->

      <div class="info-row">

        <div class="info-label">
          Contact Number
        </div>

        <div
          class="info-value"
          id="contact">

          -

        </div>

      </div>


      <!-- ANNUAL MEMBERSHIP CREDIT -->

      <div class="info-row">

        <div class="info-label">
          Annual Membership Credit
        </div>

        <div
          class="info-value credit-value"
          id="annualCredit">

          -

        </div>

      </div>


      <!-- GYM WORKOUT PLAN CREDIT -->

      <div class="info-row">

        <div class="info-label">
          Gym Workout Plan Credit
        </div>

        <div
          class="info-value credit-value"
          id="workoutCredit">

          -

        </div>

      </div>


      <!-- LOCKER RENTAL CREDIT -->

      <div class="info-row">

        <div class="info-label">
          Locker Rental Credit
        </div>

        <div
          class="info-value credit-value"
          id="lockerCredit">

          -

        </div>

      </div>


      <!-- LOGIN TIMESTAMP -->

      <div class="info-row">

        <div class="info-label">
          Login Time
        </div>

        <div
          class="info-value login-time"
          id="loginTime">

          -

        </div>

      </div>


    </div>

  </div>


  <!-- SCAN NEXT MEMBER -->

  <button
    id="scanAgain"
    onclick="resetScanner()">

    🔄 SCAN NEXT MEMBER

  </button>

</div>


<script>


/*
=================================================
GOOGLE APPS SCRIPT
=================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbxCAtD7sB_qdgt6gLdp44cc2tR-TlW3ca0aYbqxg3lRGWuAoU_OQYrOgXojZTAe0AqU/exec";


/*
=================================================
VARIABLES
=================================================
*/

let scanner = null;

let processing = false;


/*
=================================================
START SCANNER
=================================================
*/

function startScanner() {

  if (processing) {
    return;
  }

  processing = false;


  document.getElementById(
    "startButton"
  ).style.display = "none";


  document.getElementById(
    "scanAgain"
  ).style.display = "none";


  document.getElementById(
    "member"
  ).style.display = "none";


  showStatus(
    "Requesting camera..."
  );


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    onScanSuccess,

    onScanError

  )

  .then(function() {

    showStatus(
      "📷 Point the camera at the member QR Code"
    );

  })

  .catch(function(error) {

    showError(
      "CAMERA ERROR: " + error
    );


    document.getElementById(
      "startButton"
    ).style.display = "block";

  });

}


/*
=================================================
QR CODE SCANNED
=================================================
*/

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;


  const memberId =
    decodedText.trim();


  showStatus(
    "Checking Member ID..."
  );


  if (scanner) {

    scanner.stop()

      .then(function() {

        loginMember(memberId);

      })

      .catch(function() {

        loginMember(memberId);

      });

  }

  else {

    loginMember(memberId);

  }

}


/*
=================================================
LOGIN MEMBER
=================================================
*/

function loginMember(memberId) {


  const callbackName =
    "loginCallback_" +
    Date.now();


  /*
  ===============================================
  JSONP CALLBACK
  ===============================================
  */

  window[callbackName] =
    function(result) {

      handleLogin(result);


      delete window[callbackName];


      const script =
        document.getElementById(
          callbackName
        );


      if (script) {
        script.remove();
      }

    };


  /*
  ===============================================
  CREATE SCRIPT REQUEST
  ===============================================
  */

  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?action=login" +
    "&memberId=" +
    encodeURIComponent(memberId) +
    "&callback=" +
    callbackName;


  /*
  ===============================================
  ERROR
  ===============================================
  */

  script.onerror =
    function() {

      showError(
        "Unable to connect to the server."
      );


      delete window[callbackName];


      script.remove();


      processing = false;


      document.getElementById(
        "scanAgain"
      ).style.display =
        "block";

    };


  document.body.appendChild(script);

}


/*
=================================================
HANDLE LOGIN RESULT
=================================================
*/

function handleLogin(result) {

  console.log(
    "LOGIN RESULT:",
    result
  );


  /*
  ===============================================
  LOGIN FAILED
  ===============================================
  */

  if (
    !result ||
    !result.success
  ) {

    showError(
      result && result.message
        ? result.message
        : "Login failed."
    );


    processing = false;


    document.getElementById(
      "scanAgain"
    ).style.display =
      "block";


    return;

  }


  /*
  ===============================================
  HIDE STATUS
  ===============================================
  */

  document.getElementById(
    "status"
  ).style.display =
    "none";


  /*
  ===============================================
  SHOW MEMBER CARD
  ===============================================
  */

  document.getElementById(
    "member"
  ).style.display =
    "block";


  /*
  ===============================================
  NAME
  ===============================================
  */

  document.getElementById(
    "memberName"
  ).innerText =
    displayValue(
      result.name
    );


  /*
  ===============================================
  MEMBER ID
  ===============================================
  */

  document.getElementById(
    "memberId"
  ).innerText =
    displayValue(
      result.memberId
    );


  /*
  ===============================================
  CONTACT
  ===============================================
  */

  document.getElementById(
    "contact"
  ).innerText =
    displayValue(
      result.contact
    );


  /*
  ===============================================
  ANNUAL MEMBERSHIP CREDIT
  ===============================================
  */

  document.getElementById(
    "annualCredit"
  ).innerText =
    displayCredit(
      result.annualCredit
    );


  /*
  ===============================================
  GYM WORKOUT PLAN CREDIT
  ===============================================
  */

  document.getElementById(
    "workoutCredit"
  ).innerText =
    displayCredit(
      result.workoutCredit
    );


  /*
  ===============================================
  LOCKER RENTAL CREDIT
  ===============================================
  */

  document.getElementById(
    "lockerCredit"
  ).innerText =
    displayCredit(
      result.lockerCredit
    );


  /*
  ===============================================
  LOGIN TIMESTAMP
  ===============================================
  */

  document.getElementById(
    "loginTime"
  ).innerText =
    displayValue(
      result.timestamp
    );


  /*
  ===============================================
  SHOW SCAN AGAIN
  ===============================================
  */

  document.getElementById(
    "scanAgain"
  ).style.display =
    "block";

}


/*
=================================================
DISPLAY NORMAL VALUE
=================================================
*/

function displayValue(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "N/A";

  }

  return String(value);

}


/*
=================================================
DISPLAY CREDIT
=================================================
*/

function displayCredit(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "N/A";

  }


  /*
  No calculation.

  This simply displays
  whatever Apps Script
  returned from DATA.
  */

  return String(value);

}


/*
=================================================
RESET SCANNER
=================================================
*/

function resetScanner() {

  processing = false;


  document.getElementById(
    "member"
  ).style.display =
    "none";


  document.getElementById(
    "scanAgain"
  ).style.display =
    "none";


  document.getElementById(
    "startButton"
  ).style.display =
    "block";


  document.getElementById(
    "reader"
  ).innerHTML =
    "";


  showStatus(
    "Press START SCANNER"
  );

}


/*
=================================================
STATUS
=================================================
*/

function showStatus(message) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "status";


  status.innerText =
    message;


  status.style.display =
    "block";

}


/*
=================================================
ERROR
=================================================
*/

function showError(message) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    "status error";


  status.innerText =
    message;


  status.style.display =
    "block";

}


/*
=================================================
NORMAL SCANNER ERRORS
=================================================
*/

function onScanError(errorMessage) {

  /*
  Normal QR scanning errors
  are ignored.
  */

}

</script>

</body>

</html>
